name: build
on:
  push: {branches: [main]}
  pull_request:
jobs:
  site-matches-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      # build.js reads ../_build/blocked-terms.txt, a private list kept outside this repo. The runner gets an empty
      # one so the build runs; the real check against that list happens on the author's machine before publishing.
      - run: mkdir -p ../_build && : > ../_build/blocked-terms.txt
      - run: node build.js
      # chapters.json and search.json carry the build date; pin it to the committed one so only real drift fails.
      - run: |
          for f in chapters.json search.json; do
            old=$(git show HEAD:docs/$f | grep -o -m1 '"generated": *"[0-9-]*"')
            sed -i "0,/\"generated\": *\"[0-9-]*\"/s//$old/" docs/$f
          done
      # Fails if the committed docs/ is not what the committed sources build to.
      - run: git diff --exit-code -- docs/
